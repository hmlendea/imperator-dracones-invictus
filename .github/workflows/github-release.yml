name: GitHub Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Extract the version from the GitHub tag
      id: version
      run: |
        VERSION="${VERSION#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build the release archive
      id: package
      shell: bash
      run: |
        ARCHIVE_NAME="dracones-invictus_${{ steps.version.outputs.version }}.zip"

        zip -r "${ARCHIVE_NAME}" "dracones-invictus/" "dracones-invictus.mod"

        echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

    - name: Publish the release asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        files: ${{ steps.package.outputs.archive_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
