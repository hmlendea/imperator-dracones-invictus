name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Build the release archive
      run: |
        zip -r "release.zip" "dracones-invictus/" "dracones-invictus.mod"

    - name: Extract the release archive
      run: |
        unzip "release.zip" -d "release/"

    - name: Upload
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 859580
        itemid: 1745923673
        path: "release/dracones-invictus/"
        changenote: "[url=https://github.com/hmlendea/imperator-dracones-invictus/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}
