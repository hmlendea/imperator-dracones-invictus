l_english:
 shamanism:0 "Zamolxian"
 convert_to_shamanism:0 "Embrace the Zamolxian Faith"
 convert_to_shamanism_desc:0 "The teachings of great Zamolxis has become more apparent and important among our young these last years. They look to his words on how to live their lives, and even some of our elders have been affected by this shift to the novel faith. It is time the rest of us follow his ideas as well."
 desc_shamanism:0 "Whether Zamolxis was originally a prophet or a god, is indeterminate. The Dacians and Getae however, revere Zamolxis as a divine entity, ascribing numerous miraculous acts to him."
 treasure_axe_of_zalmoxis.yml:0 "Zamolxis' Axe"
 treasure_axe_of_zamolxis_desc:0 "Zamolxis is a philosopher, ancestor, and divinity among the Dacians and Thracians, frequently portrayed with different weapons or tools."
